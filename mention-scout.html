  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .dock.busy .status i { animation: pulse 0.9s ease-in-out infinite; }

  .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  button {

/* ---------- canvas drawing ---------- */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w * TS; c.height = h * TS;

function wrap(g, text, x, y, maxW, lh, maxLines) {
  const words = text.split(' '); let line = '', lines = [];
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    let last = lines[maxLines - 1];
    while (g.measureText(last + '…').width > maxW) last = last.slice(0, -1);
    lines[maxLines - 1] = last.trimEnd() + '…';
  }
  lines.forEach((l, i) => g.fillText(l, x, y + i * lh));
  return y + (lines.length - 1) * lh;
}
function fit(g, text, maxW) {
  if (g.measureText(text).width <= maxW) return text;
  while (text && g.measureText(text + '…').width > maxW) text = text.slice(0, -1);
  return text + '…';

function hueOf(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }

}
function mat(map) {
  return new THREE.MeshBasicMaterial({ map, transparent: true, depthTest: false, depthWrite: false });
}

/* ---------- tweens ---------- */
const E = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outBack: t => { const s = 1.5; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },
  softBack: t => { const s = 0.9; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },
};
let tweens = [];
function to(obj, props, dur, ease = E.outCubic, delay = 0) {
  return new Promise(res => {
    props = { ...props };
    tweens = tweens.filter(o => {
      if (o.obj !== obj) return true;
      for (const k in props) delete o.props[k];
      if (Object.keys(o.props).length) return true;
      o.res(); return false;
    });
    tweens.push({ obj, props, dur, delay, ease, t0: performance.now(), from: null, res });
  });
}
function updateTweens(now) {
  tweens = tweens.filter(tw => {
    const e = now - tw.t0 - tw.delay;
    if (e < 0) return true;
    if (!tw.from) { tw.from = {}; for (const k in tw.props) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, e / tw.dur), k = tw.ease(p);
    for (const key in tw.props) tw.obj[key] = tw.from[key] + (tw.props[key] - tw.from[key]) * k;
    if (p >= 1) { tw.res(); return false; }
    return true;
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- layout ---------- */
const GX = 0.42, GY = 0.4;
let cols = 6, rows = 5;
function computeGrid() {
  const a = innerWidth / innerHeight;
  cols = a >= 1.25 ? 6 : a >= 0.8 ? 5 : 3;
  rows = Math.ceil(POSTS.length / cols);
}
const gridW = () => cols * CARD_W + (cols - 1) * GX;
const gridH = () => rows * CARD_H + (rows - 1) * GY;
const portrait = () => innerWidth / innerHeight < 0.9;

function fitDist(w, h) {
  const vf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const hudSpace = innerWidth < 560 ? 210 : 170;
  const uh = Math.max(0.45, (innerHeight - hudSpace) / innerHeight);
  const uw = (innerWidth - 32) / innerWidth;
  return Math.max((h / 2) / (vf * uh), (w / 2) / (vf * camera.aspect * uw));
}
const frame = (x, y, w, h) => ({ x, y, z: fitDist(w, h) });

// Step 3 clusters: card scaled up, six profiles fanned around it
const S3 = 1.3, NODE_S = 1.2;
const NODE_W = (NW + NM * 2) * U * NODE_S;
const nodeSpots = () => {
  const hw = CARD_W * S3 / 2, hh = CARD_H * S3 / 2, nw = NW * U * NODE_S, nh = NH * U * NODE_S;
  const sx = hw + 0.45 + nw / 2, tx = nw / 2 + 0.55, ty = hh + 0.45 + nh / 2;
  return [[-tx, ty], [tx, ty], [sx, 0], [tx, -ty], [-tx, -ty], [-sx, 0]];
};
const CLUSTER_W = () => CARD_W * S3 + 2 * (0.45 + NW * U * NODE_S) + 0.4;
const CLUSTER_H = () => CARD_H * S3 + 2 * (0.45 + NH * U * NODE_S) + 0.4;
function clusterCenter(i) {
  const k = i - 1;
  return portrait() ? [0, -k * (CLUSTER_H() + 0.6)] : [k * (CLUSTER_W() + 0.6), 0];
}
function viewFrame(v) {
  if (v.type === 'cluster') { const [x, y] = clusterCenter(v.i); return frame(x, y, CLUSTER_W() + 0.6, CLUSTER_H() + 0.6); }
  if (v.type === 'clusters') {
    return portrait() ? frame(0, 0, CLUSTER_W(), CLUSTER_H() * 3 + 1.8) : frame(0, 0, CLUSTER_W() * 3 + 1.8, CLUSTER_H());
  }
  return frame(0, 0, gridW() + 0.6, gridH() + 0.6);
}

/* ---------- build scene ---------- */
const cardGeo = new THREE.PlaneGeometry((CW + CM * 2) * U, (CH + CM * 2) * U);
const nodeGeo = new THREE.PlaneGeometry((NW + NM * 2) * U, (NH + NM * 2) * U);
const unitGeo = new THREE.PlaneGeometry(1, 1);
let glowTex, cards = [], nodes = [];
const badgeCache = new Map();
function badgeTex(text) {
  if (!badgeCache.has(text)) { const b = drawBadge(text); badgeCache.set(text, { t: tex(b.canvas), w: b.w * U, h: b.h * U }); }
  return badgeCache.get(text);
}

function buildCards() {
  glowTex = tex(drawGlow());
  pulseMat.map = glowTex; pulseMat.needsUpdate = true;
  POSTS.forEach((p, i) => {
    const m = mat(tex(drawCard(p)));
    const mesh = new THREE.Mesh(cardGeo, m);
    const glowMat = mat(glowTex); glowMat.opacity = 0;
    const glow = new THREE.Mesh(cardGeo, glowMat);
    const badgeMat = mat(null);
    const badge = new THREE.Mesh(unitGeo, badgeMat);
    mesh.add(glow, badge);
    scene.add(mesh);
    const c = {
      i, p, mesh, mat: m, glow, glowMat, badge, badgeMat, home: null, bw: 0, bh: 0,
      st: { x: 0, y: 0, z: 0, s: 1, rz: 0, op: 0, amp: 1, glow: 0, badge: 0, ph: ((i * 0.6180339) % 1) * Math.PI * 2 },
    };
    c.setBadge = text => {
      const b = badgeTex(text);
      badgeMat.map = b.t; badgeMat.needsUpdate = true; c.bw = b.w; c.bh = b.h;
      badge.position.set(-CARD_W / 2 + b.w / 2, CARD_H / 2 + b.h / 2 + 0.07, 0);
    };
    c.setFront = on => { mesh.renderOrder = on ? 20 : 0; glow.renderOrder = on ? 21 : 0; badge.renderOrder = on ? 22 : 0; };
    cards.push(c);
  });
  PICKS.forEach(pk => cards[pk.idx].setBadge(pk.fit));
}

function layoutHomes() {
  computeGrid();
  const half = Math.ceil(POSTS.length / 2);
  cards.forEach((c, i) => {
    const slot = i < half ? i * 2 : (i - half) * 2 + 1; // interleave X and Reddit
    const col = slot % cols, row = Math.floor(slot / cols);
    const inRow = row === rows - 1 ? POSTS.length - row * cols : cols; // centre a short last row
    c.home = {
      x: (col - (inRow - 1) / 2) * (CARD_W + GX),
      y: ((rows - 1) / 2 - row) * (CARD_H + GY),
      z: Math.sin(i * 12.9898) * 0.35,
    };
  });
}

// scan pulse that rings the active card
const pulseMat = mat(null); pulseMat.opacity = 0;
const pulse = new THREE.Mesh(cardGeo, pulseMat); pulse.renderOrder = 19; scene.add(pulse);
const pulseSt = { s: 1, op: 0, card: null };

function addNode(card, spot, profile) {
  const m = mat(tex(drawNode(...profile)));
  const mesh = new THREE.Mesh(nodeGeo, m); mesh.renderOrder = 20;
  const lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  const lineMat = new THREE.LineBasicMaterial({ color: 0x8C9AB5, transparent: true, depthTest: false, opacity: 0 });
  const line = new THREE.Line(lineGeo, lineMat); line.renderOrder = 15; line.frustumCulled = false;
  scene.add(mesh, line);
  const n = { card, mesh, mat: m, line, lineMat, st: { x: spot[0], y: spot[1], z: 0, s: 0, op: 0, lp: 0, lop: 0, ph: Math.random() * Math.PI * 2 } };
  nodes.push(n);
  return n;
}
function clearNodes() {
  for (const n of nodes) {
    scene.remove(n.mesh, n.line);
    n.mat.map.dispose(); n.mat.dispose(); n.line.geometry.dispose(); n.lineMat.dispose();
  }
  nodes = [];
}

/* ---------- render loop ---------- */
const cam = { x: 0, y: 0, z: 30 };
let view = { type: 'overview' };
const TAU = Math.PI * 2;
const tmp = new THREE.Vector3();

function tick(now) {
  updateTweens(now);
  const L = (now % PERIOD) / PERIOD * TAU;

  for (const c of cards) {
    const s = c.st, a = s.amp * HOVER;
    c.mesh.visible = s.op > 0.002;
    c.mesh.position.set(s.x, s.y + Math.sin(L + s.ph) * 0.11 * a, s.z);
    c.mesh.rotation.set(Math.sin(L + s.ph + 1.3) * 0.05 * a, Math.cos(L + s.ph * 1.7) * 0.065 * a, s.rz + Math.sin(L + s.ph + 2.1) * 0.012 * a);
    c.mesh.scale.setScalar(s.s);
    c.mat.opacity = s.op;
    c.glowMat.opacity = s.glow * s.op;
    c.glow.visible = s.glow > 0.002;
    c.badge.visible = s.badge > 0.002;
    c.badge.scale.set(c.bw * Math.max(s.badge, 0.001), c.bh * Math.max(s.badge, 0.001), 1);
    c.badgeMat.opacity = Math.min(1, s.badge) * s.op;
  }

  for (const n of nodes) {
    const s = n.st, cp = n.card.mesh.position;
    n.mesh.visible = s.s > 0.002;
    n.mesh.position.set(s.x, s.y + Math.sin(L + s.ph) * 0.07 * HOVER, s.z);
    n.mesh.rotation.set(0, 0, Math.sin(L + s.ph + 0.8) * 0.015 * HOVER);
    n.mesh.scale.setScalar(Math.max(s.s, 0.001));
    n.mat.opacity = s.op;
    const arr = n.line.geometry.attributes.position.array;
    tmp.copy(n.mesh.position).sub(cp).multiplyScalar(s.lp).add(cp);
    arr[0] = cp.x; arr[1] = cp.y; arr[2] = cp.z; arr[3] = tmp.x; arr[4] = tmp.y; arr[5] = tmp.z;
    n.line.geometry.attributes.position.needsUpdate = true;
    n.lineMat.opacity = s.lop;
  }

  if (pulseSt.card) {
    pulse.position.copy(pulseSt.card.mesh.position);
    pulse.rotation.copy(pulseSt.card.mesh.rotation);
    pulse.scale.setScalar(pulseSt.card.st.s * pulseSt.s);
  }
  pulse.visible = pulseSt.op > 0.002;
  pulseMat.opacity = pulseSt.op;

  camera.position.set(cam.x, cam.y, cam.z);
  camera.lookAt(cam.x, cam.y, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const dock = $('dock'), statusEl = $('status'), nextBtn = $('next'), nextLabel = $('nextLabel');
const state = { step: 0, busy: false };
let runId = 0;
const NEXT_LABEL = { 0: 'Highlight best fits', 1: 'Highlight best fits', 2: 'Crawl their profiles', 3: 'Done' };

function status(t) { statusEl.textContent = t; }
function setBusy(b) {
  state.busy = b; dock.classList.toggle('busy', b);
  nextBtn.disabled = b || state.step >= 3;
  nextLabel.textContent = NEXT_LABEL[state.step];
}
function setStep(n) {
  [1, 2, 3].forEach(i => {
    $('s' + i).classList.toggle('on', i === n);
    $('s' + i).classList.toggle('done', i < n);
  });
}

/* ---------- steps ---------- */
async function step1(id) {
  setStep(1); setBusy(true); status('Scanning X and Reddit…');
  let found = 0;
  const order = cards.map((_, i) => i).sort(() => Math.random() - 0.5);
  await Promise.all(order.map((i, k) => {
    const c = cards[i], s = c.st, h = c.home;
    Object.assign(s, {
      x: h.x * 1.6 + (Math.random() - 0.5) * 6, y: h.y - 16 - Math.random() * 6, z: -10,
      rz: (Math.random() - 0.5) * 1.4, s: 0.8, op: 0, amp: 1, glow: 0, badge: 0,
    });
    const d = 120 + k * 32;
    to(s, { op: 1 }, 380, E.outCubic, d);
    return to(s, { x: h.x, y: h.y, z: h.z, rz: 0, s: 1 }, 1000, E.outExpo, d)
      .then(() => { if (id === runId) status(`Scanning X and Reddit… ${++found} mentions`); });
  }));
  if (id !== runId) return;
  state.step = 1;
  status(`${POSTS.length} mentions of problems we can solve`);
  setBusy(false);
}

async function step2(id) {
  setStep(2); setBusy(true); status('Scoring intent and fit…');
  const picks = PICKS.map(p => cards[p.idx]);
  const others = cards.filter(c => !picks.includes(c));

  // pull the picks toward the camera in a row (column when portrait)
  const D = cam.z, vf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const gap = 0.6, port = portrait();
  const rowW = port ? CARD_W : 3 * CARD_W + 2 * gap;
  const rowH = port ? 3 * CARD_H + 2 * (gap + 0.3) : CARD_H + 0.4;
  const z2 = Math.max(-2, Math.min(D - 4, D - Math.max(rowW / (2 * 0.8 * vf * camera.aspect), rowH / (2 * 0.68 * vf))));

  others.forEach((c, k) => to(c.st, { op: 0.32, z: c.home.z - 1.5, s: 0.96 }, 650, E.outCubic, (k % 10) * 12));
  await sleep(160); if (id !== runId) return;
  picks.forEach((c, k) => {
    c.setFront(true);
    const off = k - 1;
    const x = port ? 0 : off * (CARD_W + gap);
    const y = port ? -off * (CARD_H + gap + 0.3) : -0.1;
    const d = k * 110;
    to(c.st, { x, y, z: z2, rz: 0, s: 1, amp: 0.45 }, 850, E.softBack, d);
    to(c.st, { glow: 1 }, 420, E.outCubic, d + 380);
    to(c.st, { badge: 1 }, 480, E.outBack, d + 480);
  });
  await sleep(1150); if (id !== runId) return;
  state.step = 2;
  status('3 best fits: high intent, clear problem');
  setBusy(false);
}

async function step3(id) {
  setStep(3); setBusy(true); status('Resolving identities…');
  const picks = PICKS.map(p => cards[p.idx]);
  cards.filter(c => !picks.includes(c)).forEach(c => to(c.st, { op: 0.12, z: c.home.z - 6 }, 800, E.outCubic));
  picks.forEach((c, k) => {
    const [x, y] = clusterCenter(k);
    to(c.st, { x, y, z: 0, s: S3, amp: 0.3, glow: 0.6 }, 900, E.inOutCubic, k * 60);
  });
  view = { type: 'cluster', i: 0 };
  await to(cam, viewFrame(view), 950, E.inOutCubic);
  if (id !== runId) return;

  let total = 0;
  for (let i = 0; i < PICKS.length; i++) {
    const pk = PICKS[i], card = picks[i];
    if (i > 0) {
      view = { type: 'cluster', i };
      picks.forEach((c, k) => to(c.st, { op: k === i ? 1 : 0.45 }, 400));
      nodes.forEach(n => { to(n.st, { op: 0.45 }, 400); to(n.st, { lop: 0.2 }, 400); });
      await to(cam, viewFrame(view), 750, E.inOutCubic);
      if (id !== runId) return;
    } else {
      picks.forEach((c, k) => to(c.st, { op: k === 0 ? 1 : 0.45 }, 400));
    }
    to(card.st, { glow: 1 }, 250);
    const [cx, cy] = clusterCenter(i);
    const spots = nodeSpots();
    for (let j = 0; j < pk.profiles.length; j++) {
      const prof = pk.profiles[j];
      status(`${pk.name} · checking ${PLATFORMS[prof[0]].label}…`);
      pulseSt.card = card; pulseSt.s = 1; pulseSt.op = 0.85;
      to(pulseSt, { s: 1.22, op: 0 }, 480, E.outCubic);
      await sleep(150); if (id !== runId) return;
      const n = addNode(card, [cx + spots[j][0], cy + spots[j][1]], prof);
      n.st.lop = 0.9;
      to(n.st, { lp: 1 }, 230, E.outCubic);
      to(n.st, { s: NODE_S }, 420, E.outBack, 170);
      to(n.st, { op: 1 }, 200, E.outCubic, 170);
      total++;
      status(`${pk.name} · found ${PLATFORMS[prof[0]].label}`);
      await sleep(310); if (id !== runId) return;
    }
    card.setBadge(`${pk.fit.split(' · ')[0]} · ${pk.profiles.length} profiles linked`);
    card.st.badge = 0.6; to(card.st, { badge: 1, glow: 0.6 }, 380, E.outBack);
    status(`${pk.name} · ${pk.profiles.length} profiles linked`);
    await sleep(420); if (id !== runId) return;
  }

  view = { type: 'clusters' };
  picks.forEach(c => to(c.st, { op: 1 }, 500));
  nodes.forEach(n => { to(n.st, { op: 1 }, 500); to(n.st, { lop: 0.9 }, 500); });
  await to(cam, viewFrame(view), 1000, E.inOutCubic);
  if (id !== runId) return;
  state.step = 3;
  status(`3 prospects · ${total} profiles linked`);
  setBusy(false);
}

function next() {
  if (state.busy) return;
  if (state.step === 1) step2(runId);
  else if (state.step === 2) step3(runId);
}

function reset() {
  const id = ++runId;
  tweens.forEach(t => t.res()); tweens = [];
  clearNodes();
  pulseSt.op = 0; pulseSt.card = null;
  layoutHomes();
  cards.forEach(c => { c.setFront(false); c.st.op = 0; });
  PICKS.forEach(pk => cards[pk.idx].setBadge(pk.fit));
  state.step = 0;
  view = { type: 'overview' };
  Object.assign(cam, viewFrame(view));
  step1(id);
}

nextBtn.addEventListener('click', next);
$('reset').addEventListener('click', reset);
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button')) { if (e.key === 'Enter' || e.key === ' ') return; }
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'r' || e.key === 'R') reset();
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (state.step === 1 && !state.busy) {
    layoutHomes();
    cards.forEach(c => to(c.st, { x: c.home.x, y: c.home.y, z: c.home.z }, 500, E.outCubic));
  }
  if (!tweens.some(t => t.obj === cam)) Object.assign(cam, viewFrame(view));
});

/* ---------- boot ---------- */
(async () => {
  try {
    await Promise.race([
      Promise.all(['400', '500', '600', '700'].map(w => document.fonts.load(`${w} 16px "Instrument Sans"`)).concat(document.fonts.load('500 12px "JetBrains Mono"'))),
      sleep(2500),
    ]);
  } catch {}
  buildCards();
  requestAnimationFrame(tick);
  reset();
})();
</script>
