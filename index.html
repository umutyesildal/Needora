<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mention Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- All content lives in config/. This file is the engine: edit it only to change how the demo looks or moves. -->
<script src="config/presenter.js"></script>
<script src="config/platforms.js"></script>
<script>
  // Which client demo to show: index.html?demo=rowrun loads config/rowrun/. With no ?demo it shows rowrun.
  // client.js loads first. It can list DATA_FILES (e.g. a lead export) that load before scenario.js.
  // Classic scripts written in order, so this works from file:// as well as from a server.
  const DEMO = (/^[a-z0-9-]+$/.exec(new URLSearchParams(location.search).get('demo') || '') || ['rowrun'])[0];
  document.write(`<script src="config/${DEMO}/client.js"><\/script>`);
</script>
<script>
  if (typeof CLIENT !== 'undefined') {
    const files = [...(typeof DATA_FILES !== 'undefined' ? DATA_FILES : []), `config/${DEMO}/scenario.js`];
    for (const src of files) document.write(`<script src="${src}"><\/script>`);
  }
</script>
<style>
  /* Layout: presenter shell (config/presenter.js) = intro curtain, HUD, brief rail on the left, WebGL stage, control dock.
     Step 6 opens a page in the client's look (config/<demo>/client.js) in a browser window. Light mode only, by request.
     Fallback values below; the real ones are applied from config on load. Classes starting rr- style the client page. */
  :root {
    --bg: #F4F3F2;
    --dot: #DCD8D6;
    --ink: #000000;
    --muted: #625D5B;
    --line: #E2DEDC;
    --surface: #FFFFFF;
    --accent: #7C1010;
    --accent-hover: #5E0B0B;
    --accent-soft: #F6ECEC;
    --f-ui: "Rubik", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --rr-blue: #005FFF;
    --rr-navy: #13004E;
    --rr-tint: #EEF4FF;
    --f-rr: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); overflow: hidden; }
  #stage {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0) 0 0 / 22px 22px, var(--bg);
  }
  #stage canvas { display: block; }

  /* ---- intro curtain ---- */
  .intro {
    position: fixed; inset: 0; z-index: 9; background: var(--accent); color: #fff;
    display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px));
    transition: transform .7s cubic-bezier(.7,0,.2,1);
  }
  .intro.out { transform: translateY(-100%); }
  .intro-in { display: grid; justify-items: center; gap: 18px; text-align: center; }
  .intro-in > img { height: clamp(34px, 6vw, 56px); width: auto; }
  .intro-in p { margin: 0; font-size: clamp(18px, 2.4vw, 26px); font-weight: 400; letter-spacing: -0.01em; max-width: 26ch; text-wrap: balance; }
  .intro-brief { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 14px 8px 10px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; font-size: 14px; }
  .intro-brief span { opacity: .75; text-transform: uppercase; letter-spacing: .1em; font-size: 11px; font-weight: 500; }
  .intro-brief img { height: 16px; width: auto; }
  .intro-in > * { animation: introRise .6s cubic-bezier(.2,.8,.2,1) both; }
  .intro-in > :nth-child(2) { animation-delay: .08s; }
  .intro-in > :nth-child(3) { animation-delay: .16s; }
  @keyframes introRise { from { opacity: 0; transform: translateY(12px); } }

  /* ---- HUD ---- */
  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap;
    pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand img { height: 22px; width: auto; display: block; }
  .brand b { font-size: 13px; font-weight: 600; padding-left: 12px; border-left: 1px solid var(--line); }
  .brand span { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .step {
    font: 500 11.5px var(--f-ui); letter-spacing: 0.02em;
    padding: 6px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.75); border: 1px solid var(--line); color: var(--muted);
    transition: background .25s, color .25s, border-color .25s;
  }
  .step.done { color: var(--ink); }
  .step.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }

  /* ---- brief rail ---- */
  .brief {
    position: fixed; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px));
    top: calc(env(safe-area-inset-top, 0px) + 60px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    width: 286px; overflow: auto; display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: none;
  }
  .brief::-webkit-scrollbar { display: none; }
  .brief section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .eyebrow { font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
  .b-client img { height: 20px; width: auto; display: block; margin-bottom: 8px; }
  .b-client p { margin: 0 0 10px; font-size: 13px; line-height: 1.45; color: #3B3735; }
  .b-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .b-chips span { font-size: 11.5px; padding: 3px 8px; border-radius: 999px; background: #F3F1F0; color: #3B3735; }
  .b-now { background: var(--ink) !important; border-color: var(--ink) !important; color: #fff; }
  .b-now .eyebrow { color: rgba(255,255,255,.6); }
  .b-now h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .b-now p { margin: 0; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.82); }
  .b-now.flash { animation: flash .5s ease; }
  @keyframes flash { from { background: var(--accent); border-color: var(--accent); } }
  .funnel { display: grid; gap: 7px; }
  .frow { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 12.5px; opacity: .38; transition: opacity .4s; }
  .frow.on { opacity: 1; }
  .frow b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .frow i { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: #F0EDEB; overflow: hidden; }
  .frow i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--ink); border-radius: 3px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .frow.red i::after { background: var(--accent); }
  .frow:not(.on) i::after { width: 0; }
  .srcs { display: grid; gap: 6px; font-size: 12.5px; }
  .srcs div { display: grid; grid-template-columns: 84px 1fr 30px; align-items: center; gap: 8px; }
  .srcs i { height: 6px; border-radius: 3px; background: #F0EDEB; overflow: hidden; }
  .srcs i::after { content: ""; display: block; height: 100%; width: var(--w); background: #3B3735; border-radius: 3px; }
  .srcs b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .weights { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin-bottom: 8px; }
  .weights i { display: block; }
  .wlegend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12px; color: #3B3735; }
  .wlegend span { display: flex; align-items: center; gap: 6px; }
  .wlegend span::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
  .b-note { font-size: 11.5px; line-height: 1.45; color: var(--muted); margin: 0; padding: 0 4px; }

  /* ---- dock ---- */
  .dock {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 5;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    width: max-content; max-width: calc(100% - 32px);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    padding: 6px 6px 6px 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 30px -12px rgba(0,0,0,0.22), 0 1px 2px rgba(0,0,0,0.06);
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); min-width: 0; margin-right: 6px; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .dock.busy .status i { animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; transform: scale(0.7); } }
  .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  button {
    font: 600 13.5px var(--f-ui); border-radius: 10px; padding: 9px 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    display: inline-flex; align-items: center; gap: 7px;
    transition: background .15s, transform .1s, opacity .2s;
  }
  button:hover { background: #F7F5F4; }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: 0.45; cursor: default; transform: none; }
  button svg { width: 15px; height: 15px; }

  /* ---- step 6: browser window ---- */
  .scrim { position: fixed; inset: 0; z-index: 3; background: rgba(240,237,235,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity .4s; }
  .browser {
    position: fixed; z-index: 4;
    top: calc(env(safe-area-inset-top, 0px) + 62px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
    left: 50%; width: min(1080px, calc(100% - 32px)); margin-left: max(-540px, calc(-50% + 16px));
    display: flex; flex-direction: column; overflow: hidden;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.06);
    transform-origin: 0 0;
  }
  .bar { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px; background: #F5F3F2; border-bottom: 1px solid var(--line); }
  .bar .dots { display: flex; gap: 6px; flex: none; }
  .bar .dots i { width: 11px; height: 11px; border-radius: 50%; background: #DCD8D6; }
  .bar .url {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    font-size: 12.5px; color: var(--muted);
  }
  .bar .url span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .url b { color: var(--ink); font-weight: 500; }
  .bar .url svg { width: 12px; height: 12px; flex: none; }
  .tabs { display: flex; gap: 4px; flex: none; }
  .tabs button { padding: 3px 10px 3px 3px; gap: 6px; font-size: 12.5px; border-radius: 999px; background: transparent; border-color: transparent; color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: #fff; border-color: var(--line); color: var(--ink); }
  .bar .close { padding: 6px; border-radius: 8px; background: transparent; border-color: transparent; }
  .bar .close svg { width: 16px; height: 16px; }
  .page { flex: 1; overflow: auto; background: #FAFAFA; }
  .ph { display: inline-block; overflow: hidden; border-radius: 50%; flex: none; }
  .ph img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* ---- client page (the client's look: --rr-blue/navy/tint and --f-rr come from config/<demo>/client.js): pitch on the left, offer on the right, proof below ---- */
  .rr { --ink2: #52525B; --sub: #71717A; --hair: #E7E7EA; --tint: var(--rr-tint); font-family: var(--f-rr); color: #18181B; opacity: 0; }
  .rr.go { opacity: 1; }
  .rr.go > * { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
  .rr.go > :nth-child(2) { animation-delay: .06s; }
  .rr.go > :nth-child(3) { animation-delay: .16s; }
  .rr.go > :nth-child(4) { animation-delay: .24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .rr-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 32px; background: #fff; border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
  .rr-nav > img { height: 22px; width: auto; display: block; }
  .made { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); background: #F4F4F5; padding: 4px 12px 4px 4px; border-radius: 999px; }
  .made b { color: #18181B; font-weight: 600; }
  .rbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; font-weight: 600; font-size: 15px; border: 1px solid var(--hair); background: #fff; color: #18181B; }
  .rbtn.p { background: var(--rr-blue); border-color: var(--rr-blue); color: #fff; }
  .rr-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 40px; padding: 44px 32px 28px; align-items: center; }
  .rr-eyebrow { color: var(--rr-blue); font-weight: 600; font-size: 15px; }
  .rr-hero h1 { font-size: clamp(30px, 4.2vw, 50px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 700; margin: 12px 0 16px; text-wrap: balance; color: #111; }
  .rr-hero .sub { font-size: 17.5px; line-height: 1.55; color: var(--sub); max-width: 46ch; margin: 0; }
  .asked { display: flex; gap: 10px; align-items: center; margin-top: 22px; font-size: 13.5px; line-height: 1.45; color: var(--sub); max-width: 52ch; }
  .asked q { color: #18181B; font-weight: 500; }
  .offer { background: #fff; border: 2px solid var(--rr-blue); border-radius: 18px; padding: 22px; position: relative; box-shadow: 0 24px 50px -30px color-mix(in srgb, var(--rr-blue) 45%, transparent); }
  .offer .tag { position: absolute; top: -12px; left: 20px; background: var(--rr-blue); color: #fff; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; letter-spacing: .04em; }
  .oc-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .oc-top h3 { margin: 4px 0 0; font-size: 15px; color: var(--sub); font-weight: 600; }
  .off { background: var(--rr-navy); color: #fff; font-weight: 700; font-size: 13px; padding: 4px 9px; border-radius: 8px; }
  .price { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 2px; flex-wrap: wrap; }
  .price s { color: #A1A1AA; font-size: 22px; font-weight: 600; text-decoration-thickness: 2px; }
  .price b { font-size: 46px; letter-spacing: -0.035em; color: var(--rr-navy); }
  .price span { color: var(--sub); font-size: 14px; }
  .then { font-size: 13px; color: var(--sub); margin-bottom: 14px; }
  .timer { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--rr-navy); color: #fff; border-radius: 12px; padding: 12px 14px; }
  .timer small { font-size: 12.5px; line-height: 1.35; color: rgba(255,255,255,.8); }
  .clock { display: flex; gap: 6px; }
  .clock span { display: grid; justify-items: center; min-width: 46px; padding: 6px 4px 5px; background: rgba(255,255,255,.12); border-radius: 8px; }
  .clock b { font-size: 19px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock i { font-style: normal; font-size: 10px; margin-top: 3px; color: rgba(255,255,255,.7); }
  .offer ul { list-style: none; padding: 0; margin: 14px 0 16px; display: grid; gap: 8px; }
  .offer li { display: flex; gap: 9px; font-size: 14.5px; align-items: flex-start; }
  .offer li::before { content: ""; flex: none; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; background: var(--tint) var(--check) center/16px no-repeat; }
  .offer .rbtn { box-sizing: border-box; width: 100%; padding: 13px 18px; font-size: 16px; }
  .rr-sec { padding: 8px 32px 28px; }
  .rr-sec h2 { font-size: 20px; letter-spacing: -0.025em; margin: 0 0 12px; }
  .prompt { background: #fff; border: 1px solid var(--hair); border-radius: 16px; padding: 16px 18px; }
  .prompt small { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 8px; }
  .prompt p { margin: 0; font-size: 16.5px; line-height: 1.55; color: #18181B; }
  .prompt p::after { content: ""; display: inline-block; width: 2px; height: 1.1em; background: var(--rr-blue); vertical-align: -0.18em; margin-left: 2px; animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .run { background: #fff; border: 1px solid var(--hair); border-radius: 16px; overflow: hidden; margin-top: 12px; }
  .run-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; flex-wrap: wrap; }
  .run-head i { width: 9px; height: 9px; border-radius: 50%; background: var(--rr-blue); }
  .run-head b { font-size: 15px; }
  .run-head span { margin-left: auto; color: var(--sub); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .run-head em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--sub); background: #F4F4F5; border-radius: 6px; padding: 2px 7px; }
  .progress { height: 6px; margin: 0 18px 12px; border-radius: 3px; background: #EDEDF0; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--rr-blue); border-radius: 3px; }
  .rr.go .progress i { animation: fill 1.6s cubic-bezier(.2,.8,.2,1) .5s forwards; }
  @keyframes fill { to { width: var(--w); } }
  .table { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 620px; }
  th { text-align: left; font-weight: 500; color: var(--sub); font-size: 12px; padding: 8px 18px; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); background: #FAFAFA; }
  td { padding: 10px 18px; border-bottom: 1px solid #F1F1F3; vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  .rr.go tbody tr { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
  .rr.go tbody tr:nth-child(1) { animation-delay: .7s; }
  .rr.go tbody tr:nth-child(2) { animation-delay: .85s; }
  .rr.go tbody tr:nth-child(3) { animation-delay: 1s; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: var(--tint); color: var(--rr-blue); }
  .pill.warn { background: #FEF3C7; color: #92400E; }
  .pill.mute { background: #F4F4F5; color: var(--sub); }
  .rr-foot { padding: 16px 32px 24px; border-top: 1px solid var(--hair); font-size: 12.5px; color: var(--sub); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .found { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-ui); color: #3B3735; }
  .found img { height: 12px; width: auto; }

  @media (max-width: 1099px), (max-height: 620px) { .brief { display: none; } }
  @media (max-width: 760px) {
    .rr-hero { grid-template-columns: 1fr; }
    .rr-hero { padding: 32px 20px 24px; gap: 24px; }
    .rr-nav, .rr-sec, .rr-foot { padding-left: 20px; padding-right: 20px; }
    .tabs button span { display: none; }
    .tabs button { padding: 3px; }
  }
  @media (max-width: 640px) { .brand span { display: none; } .status { flex-basis: 100%; justify-content: center; margin: 2px 0 0; } .dock { padding: 6px; } .step { padding: 5px 8px; } .bar .dots { display: none; } }
  @media (prefers-reduced-motion: reduce) { .rr.go > *, .rr.go tbody tr, .intro-in > * { animation: none; } .rr.go .progress i { width: var(--w); animation: none; } }
</style>

<div id="stage"></div>

<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-in">
    <img id="introLogo" alt="">
    <p id="introTagline"></p>
    <div class="intro-brief"><span>Today's brief</span><img id="introMark" alt=""><b id="introClient" style="font-weight:400"></b></div>
  </div>
</div>

<header class="hud">
  <div class="brand"><img id="hudLogo" alt=""><b>Mention Scout</b><span id="hudScope"></span></div>
  <div class="steps" aria-label="Progress">
    <div class="step" id="s1">1 Collect</div>
    <div class="step" id="s2">2 Match</div>
    <div class="step" id="s3">3 Plan</div>
    <div class="step" id="s4">4 Tone</div>
    <div class="step" id="s5">5 Reply</div>
    <div class="step" id="s6">6 Page</div>
  </div>
</header>

<aside class="brief" id="brief" aria-label="Brief">
  <section class="b-client">
    <div class="eyebrow">Scouting for</div>
    <img id="briefLogo" alt="">
    <p id="briefAbout"></p>
    <div class="b-chips" id="briefChips"></div>
  </section>
  <section class="b-now" id="now">
    <div class="eyebrow"><span id="nowNum">Step 1 of 6</span></div>
    <h3 id="nowTitle">Collect</h3>
    <p id="nowText"></p>
  </section>
  <section>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// COPY, PLANS, TONES, OFFER_HOURS, POSTS, NOW and PICKS (config/<demo>/scenario.js), RUN (the demo's data file).
if (typeof CLIENT === 'undefined' || typeof PICKS === 'undefined') {

  throw new Error(`Mention Scout: missing config/${DEMO}/`);
}

// Check the rules the layout depends on. Returns the first problem as a sentence, or null.
function configError() {
  if (typeof RUN === 'undefined') return 'RUN is missing: the demo data file must define RUN (screened, matched, reply, sources, weights, exported)';
  if (PLANS.length !== 3) return `PLANS needs exactly 3 entries, found ${PLANS.length}`;
  if (TONES.length !== 4) return `TONES needs exactly 4 entries, found ${TONES.length}`;
  if (PICKS.length !== 3) return `PICKS needs exactly 3 entries, found ${PICKS.length}`;
  if (NOW.length !== 7) return 'NOW needs an entry for each of the 6 steps (index 1–6, with null at 0)';
  for (const P of PICKS) {
    P.idx = POSTS.findIndex(p => p.id === P.post);
    if (P.idx < 0) return `PICK "${P.name}" points at post ${JSON.stringify(P.post)}, which no post in POSTS has`;
    if (!Array.isArray(P.profiles)) return `PICK "${P.name}" needs profiles: [] (an empty list is fine)`;
    const bad = P.profiles.find(([pl]) => !PLATFORMS[pl]);
    if (bad) return `PICK "${P.name}" uses platform "${bad[0]}", which config/platforms.js does not define`;
    if (P.profiles.length > 6) return `PICK "${P.name}" has ${P.profiles.length} profiles, the most is 6`;
    if (P.plan.probs.length !== PLANS.length || !PLANS[P.plan.pick]) return `PICK "${P.name}": plan.probs needs one value per plan and plan.pick a valid index`;
    if (P.tone.scores.length !== TONES.length || !TONES[P.tone.pick]) return `PICK "${P.name}": tone.scores needs one value per tone and tone.pick a valid index`;
    if (!P.page.run || P.page.run.rows.length < 3) return `PICK "${P.name}": page.run needs at least 3 sample rows`;
  }

}

// hex colour + alpha -> rgba(), for glows and tints derived from a brand colour
function alpha(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

function applyConfig() {
  const css = document.documentElement.style;
  const vars = { bg: THEME.bg, dot: THEME.dot, ink: THEME.ink, muted: THEME.muted, line: THEME.line, surface: THEME.surface,
    accent: THEME.accent, 'accent-hover': THEME.accentHover, 'accent-soft': THEME.accentSoft,
    'rr-blue': CLIENT.color, 'rr-navy': CLIENT.deep, 'rr-tint': CLIENT.soft };
  for (const k in vars) css.setProperty('--' + k, vars[k]);
  css.setProperty('--f-ui', `"${THEME.font}", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif`);
  css.setProperty('--f-rr', `"${CLIENT.font}", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif`);
  const tick = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4.5 8.2l2.2 2.2 4.8-4.8' fill='none' stroke='${CLIENT.color}' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>`;
  css.setProperty('--check', `url("data:image/svg+xml,${encodeURIComponent(tick)}")`);
  for (const href of new Set([THEME.fontUrl, CLIENT.fontUrl])) {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l);
  }
  document.title = `${PRESENTER.name} Mention Scout · ${CLIENT.name}`;
  const set = (id, k, v) => { document.getElementById(id)[k] = v; };
  set('introLogo', 'src', PRESENTER.lockupWhite); set('introLogo', 'alt', PRESENTER.name);
  set('introTagline', 'textContent', PRESENTER.tagline);
  set('introMark', 'src', CLIENT.markWhite); set('introClient', 'textContent', CLIENT.name);
  set('hudLogo', 'src', PRESENTER.lockupBlack); set('hudLogo', 'alt', PRESENTER.name);
  set('hudScope', 'textContent', `Brief: ${CLIENT.name} · ${COPY.window}`);
  set('briefLogo', 'src', CLIENT.logo); set('briefLogo', 'alt', CLIENT.name);
  set('briefAbout', 'textContent', CLIENT.about);
  document.getElementById('briefChips').innerHTML = CLIENT.chips.map(c => `<span>${esc(c)}</span>`).join('');
  set('briefNote', 'textContent', COPY.note);
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
applyConfig();

/* ---------- constants ---------- */
const INK = THEME.ink, MUTED = THEME.muted, ACCENT = THEME.accent, BLACK = THEME.ink, TRACK = '#EFECEA', OFF = '#C9C3C0';
const FONT = `"${THEME.font}", system-ui, -apple-system, sans-serif`;
const TS = 2;                         // canvas supersampling
const CW = 420, CH = 260, CM = 24;    // post card px + shadow margin
const CARD_W = 3.2, U = CARD_W / CW;  // world units per card px
const CARD_H = CH * U;
const NW = 250, NH = 78, NM = 14;     // profile node px
const PW = 420, PH = 236, PM = 18;    // plan / tone panel px
const RW = 420, RH = 296;             // reply px (shares PM)
const PERIOD = 6000;                  // hover loop length (ms), every motion is a whole multiple of it
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const HOVER = reduced ? 0.3 : 1;
const TAU = Math.PI * 2;

// Column layout for steps 3–6, relative to each column's origin
const Y_CARD = 1.25;
const CARD_BOTTOM = Y_CARD - CARD_H / 2;
const STRIP_Y = CARD_BOTTOM - 0.27;
const PANEL_Y = STRIP_Y - 0.25 - PH * U / 2;
const NODE_Y = [STRIP_Y - 0.56, STRIP_Y - 1.12, STRIP_Y - 1.68];
const NODE_X = 0.79, NODE_S = 0.72;
const REPLY_Y = CARD_BOTTOM - 0.3 - RH * U / 2;
const COL_GAP = 0.8, COL_STEP_V = 5.6;
const COL_CENTER_Y = 0.12, COL_H = 5.3;

/* ---------- images ---------- */
// Casual-looking crops and colour grades so the faces read like phone photos, not studio headshots.
const PHOTOS = {}, IMG = {};
const GRADES = ['saturate(1.25) contrast(1.05)', 'sepia(0.28) saturate(1.2) brightness(1.04)', 'brightness(1.1) saturate(0.8) contrast(0.95)',
  'contrast(1.12) saturate(1.35) hue-rotate(-8deg)', 'grayscale(1) contrast(1.12)', 'saturate(1.1) brightness(0.96) hue-rotate(6deg)'];
// photo ids like 'f14' resolve to assets/faces/f14.jpg; anything with a dot or slash is used as a path/URL as-is
const photoSrc = id => /[./]/.test(id) ? id : `assets/faces/${id}.jpg`;
const hueOf = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
function look(id) {

const loadImg = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
async function loadImages() {
  const ids = new Set([...PICKS.map(p => p.person && p.person.photo), ...PICKS.flatMap(p => p.profiles.map(pr => pr[3]))].filter(Boolean));
  await Promise.all([
    ...[...ids].map(async id => { PHOTOS[id] = await loadImg(photoSrc(id)); }),
    ...[['rr', CLIENT.mark], ['rrWhite', CLIENT.markWhite]].map(async ([k, src]) => { IMG[k] = await loadImg(src); }),

}
function photoCircle(g, id, x, y, r) {
  const im = id && PHOTOS[id];

}
const photoStyle = id => { const L = look(id); return `filter:${L.f};transform:scale(${L.z}) translate(${-L.ox * 100}%, ${-L.oy * 100}%)`; };
const ph = (id, size) => id ? `<span class="ph" style="width:${size}px;height:${size}px"><img src="${photoSrc(id)}" alt="" style="${photoStyle(id)}"></span>` : '';

/* ---------- canvas drawing ---------- */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');

  return [c, g];
}
function layoutLines(g, text, maxW) {
  const lines = []; let line = '';

  }

}
// draws wrapped text, returns [baseline of last line, x where the last line ends]
function wrap(g, text, x, y, maxW, lh, maxLines) {
  let lines = layoutLines(g, text, maxW);

    lines = lines.slice(0, maxLines);
    let last = lines[maxLines - 1];
    while (g.measureText(last + '…').width > maxW) last = last.slice(0, -1);
    lines[maxLines - 1] = last.trimEnd() + '…';
  }
  lines.forEach((l, i) => g.fillText(l, x, y + i * lh));

}

  if ('letterSpacing' in g) g.letterSpacing = '0px';

function chip(g, text, x, y, bg, fg) {

  const w = g.measureText(text).width + 20;
  g.fillStyle = bg; g.beginPath(); g.roundRect(x, y, w, 26, 13); g.fill();
  g.fillStyle = fg; g.fillText(text, x + 10, y + 17.5);

}
const CAT_STYLE = { 'Buying intent': [THEME.accentSoft, ACCENT], 'Pain point': [INK, '#fff'] };

// A Reddit lead. `who` (PICKS[].person) is only set for fictional demo posts; real leads stay anonymous.
function drawCard(p, who) {
  const [c, g] = makeCanvas(CW + CM * 2, CH + CM * 2);
  g.translate(CM, CM);
  surface(g, CW, CH, 16);
  if (who) {
    photoCircle(g, who.photo, 42, 42, 21);
    g.fillStyle = INK; g.font = `600 16px ${FONT}`; g.fillText(who.name, 72, 38);
    g.fillStyle = MUTED; g.font = `400 13px ${FONT}`; g.fillText(fit(g, `u/${who.handle} · ${who.role}`, 270), 72, 57);
  } else {
    g.fillStyle = '#FF4500'; g.beginPath(); g.arc(36, 36, 15, 0, TAU); g.fill();
    g.fillStyle = '#fff'; g.font = `700 12px ${FONT}`; g.textAlign = 'center'; g.fillText('r/', 36, 40); g.textAlign = 'left';
    g.fillStyle = INK; g.font = `700 13.5px ${FONT}`; g.fillText('r/' + p.sub, 60, 32);
    g.fillStyle = MUTED; g.font = `400 12.5px ${FONT}`; g.fillText(`Posted ${p.time} ago · author hidden`, 60, 50);
  }
  g.fillStyle = '#FF4500'; g.font = `700 14px ${FONT}`; g.textAlign = 'right'; g.fillText('reddit', 398, 40); g.textAlign = 'left';
  g.fillStyle = INK; g.font = `700 17px ${FONT}`;

  g.fillStyle = MUTED; g.font = `400 14px ${FONT}`;

  const w = chip(g, p.cat, 20, 214, bg, fg);
  g.fillStyle = MUTED; g.font = `500 12.5px ${FONT}`;
  g.fillText(who ? `r/${p.sub} · ${p.time} ago` : 'Public thread', 20 + w + 10, 231.5);

}

function drawGlow() {
  const [c, g] = makeCanvas(CW + CM * 2, CH + CM * 2);
  g.translate(CM, CM);

  g.strokeStyle = ACCENT; g.lineWidth = 2.5;
  g.beginPath(); g.roundRect(0, 0, CW, CH, 16); g.stroke();
  return c;
}

function drawBadge(text, color, outline) {
  const [, m] = makeCanvas(1, 1); m.font = `600 13px ${FONT}`;
  const w = Math.ceil(m.measureText(text).width) + 30, h = 30;

  g.fillStyle = fg; g.beginPath(); g.arc(13, 15, 3, 0, TAU); g.fill();

}

function glyphBox(g, P, x, y, size, radius) {
  g.fillStyle = P.color; g.beginPath(); g.roundRect(x, y, size, size, radius); g.fill();
  g.fillStyle = '#fff'; g.font = `700 ${Math.round(size * (P.glyph.length > 2 ? 0.28 : 0.4))}px ${FONT}`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(P.glyph, x + size / 2, y + size / 2 + 0.5);

function drawNode(platform, handle, detail, photo) {
  const P = PLATFORMS[platform];
  const [c, g] = makeCanvas(NW + NM * 2, NH + NM * 2);
  g.translate(NM, NM);
  surface(g, NW, NH, 12, '#E7E3E1', 12);

    g.fillStyle = '#fff'; g.beginPath(); g.roundRect(43, 45, 22, 22, 6); g.fill();

  g.fillStyle = ACCENT; g.beginPath(); g.arc(NW - 16, 24, 4, 0, TAU); g.fill();
  g.fillStyle = INK; g.font = `600 15px ${FONT}`; g.fillText(fit(g, handle, 164), 72, 48);
  g.fillStyle = MUTED; g.font = `400 12px ${FONT}`; g.fillText(fit(g, detail, 164), 72, 65);

}

// row of linked platform icons that sits under the post once the crawl collapses
function drawStrip(g, pk) {
  pk.profiles.forEach(([pl], j) => glyphBox(g, PLATFORMS[pl], j * 27, 4, 22, 6));
  g.fillStyle = MUTED; g.font = `500 12.5px ${FONT}`;
  g.fillText(pk.profiles.length ? `${pk.profiles.length} profiles linked to ${pk.name}` : 'Author anonymised · no profile lookup', pk.profiles.length * 27 + 6, 20);

function drawPlan(g, pk, p) {

  g.fillText(`${Math.round(pl.conf * e)}% confidence`, PW - 20, 30); g.textAlign = 'left';

    g.fillStyle = MUTED; g.font = `400 12px ${FONT}`; g.fillText(`$${t.price}/mo`, 20, y + 32);

    g.fillStyle = on ? BLACK : OFF; g.beginPath(); g.roundRect(108, y + 14, Math.max(9, 240 * v / 100), 9, 4.5); g.fill();
    g.textAlign = 'right'; g.fillStyle = INK; g.font = `${on ? 700 : 500} 13.5px ${FONT}`;

function drawTone(g, pk, p) {

  label(g, 'HOW TO ANSWER', 20, 30);
  if (sel) {
    g.textAlign = 'right'; g.fillStyle = ACCENT; g.font = `600 12.5px ${FONT}`;
    g.fillText(`Go ${TONES[t.pick].toLowerCase()}`, PW - 20, 30); g.textAlign = 'left';
  }

    const y = 42 + r * 34, on = sel && r === t.pick, v = t.scores[r] * e;
    if (on) { g.fillStyle = alpha(ACCENT, 0.07); g.beginPath(); g.roundRect(10, y, PW - 20, 30, 8); g.fill(); }
    g.fillStyle = on ? ACCENT : INK; g.font = `600 13.5px ${FONT}`; g.fillText(name, 20, y + 20);
    g.fillStyle = TRACK; g.beginPath(); g.roundRect(100, y + 11, 248, 9, 4.5); g.fill();
    g.fillStyle = on ? ACCENT : OFF; g.beginPath(); g.roundRect(100, y + 11, Math.max(9, 248 * v / 100), 9, 4.5); g.fill();
    g.textAlign = 'right'; g.fillStyle = on ? ACCENT : INK; g.font = `600 13.5px ${FONT}`;

// the client's avatar on Reddit: white disc with its mark
function clientAvatar(g, x, y, r) {
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.strokeStyle = alpha(CLIENT.color, 0.2); g.lineWidth = 1; g.stroke();

// Reply = short text, typed out, then the link and its preview card. p runs 0..1.25: typing, then the card fades in.
const REPLY_TEXT_Y = 82, REPLY_LH = 21;
function drawReply(g, pk, p) {

  g.fillStyle = INK; g.font = `700 13px ${FONT}`; g.fillText('u/' + CLIENT.handle, 60, 31);

/* ---------- three setup ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 400);
const ANISO = renderer.capabilities.getMaxAnisotropy();

function tex(canvas) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
  return t;
}
function mat(map) {
  return new THREE.MeshBasicMaterial({ map, transparent: true, depthTest: false, depthWrite: false });
}

/* ---------- tweens ---------- */
const E = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outBack: t => { const s = 1.5; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },
  softBack: t => { const s = 0.9; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },
  linear: t => t,
};
let tweens = [];
function to(obj, props, dur, ease = E.outCubic, delay = 0) {
  return new Promise(res => {
    props = { ...props };
    tweens = tweens.filter(o => {
      if (o.obj !== obj) return true;
      for (const k in props) delete o.props[k];
      if (Object.keys(o.props).length) return true;
      o.res(); return false;
    });
    tweens.push({ obj, props, dur, delay, ease, t0: performance.now(), from: null, res });
  });
}
function updateTweens(now) {
  tweens = tweens.filter(tw => {
    const e = now - tw.t0 - tw.delay;
    if (e < 0) return true;
    if (!tw.from) { tw.from = {}; for (const k in tw.props) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, e / tw.dur), k = tw.ease(p);
    for (const key in tw.props) tw.obj[key] = tw.from[key] + (tw.props[key] - tw.from[key]) * k;
    if (p >= 1) { tw.res(); return false; }
    return true;
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- layout ---------- */
const $ = id => document.getElementById(id);
const briefEl = $('brief');
const GX = 0.42, GY = 0.4;
let cols = 6, rows = 5;
// px on the left taken by the brief rail; the stage is framed in what's left
const inset = () => { const r = briefEl.getBoundingClientRect(); return r.width ? r.right + 8 : 0; };
function computeGrid() {
  const a = (innerWidth - inset()) / innerHeight;
  cols = a >= 1.25 ? 6 : a >= 0.8 ? 5 : 3;
  rows = Math.ceil(POSTS.length / cols);
}
const gridW = () => cols * CARD_W + (cols - 1) * GX;
const gridH = () => rows * CARD_H + (rows - 1) * GY;
const portrait = () => (innerWidth - inset()) / innerHeight < 0.9;
const VF = () => Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

function fitDist(w, h) {
  const hudSpace = innerWidth < 640 ? 220 : 170;
  const uh = Math.max(0.45, (innerHeight - hudSpace) / innerHeight);
  const uw = (innerWidth - 32 - inset()) / innerWidth;
  return Math.max((h / 2) / (VF() * uh), (w / 2) / (VF() * camera.aspect * uw));
}
// camera that centres (x, y) in the free part of the screen, right of the brief rail
function frame(x, y, w, h) {
  const z = fitDist(w, h), worldPerPx = 2 * z * VF() / innerHeight;
  return { x: x - inset() / 2 * worldPerPx, y, z };
}

function colPos(k) {
  return portrait() ? [0, -(k - 1) * COL_STEP_V] : [(k - 1) * (CARD_W + COL_GAP), 0];
}
function viewFrame(v) {
  if (v.type === 'columns') {
    return portrait()
      ? frame(0, COL_CENTER_Y, CARD_W + 0.5, COL_STEP_V * 2 + COL_H)
      : frame(0, COL_CENTER_Y, 3 * CARD_W + 2 * COL_GAP + 0.5, COL_H);
  }
  return frame(0, 0, gridW() + 0.6, gridH() + 0.6);
}

/* ---------- build scene ---------- */
const cardGeo = new THREE.PlaneGeometry((CW + CM * 2) * U, (CH + CM * 2) * U);
const nodeGeo = new THREE.PlaneGeometry((NW + NM * 2) * U, (NH + NM * 2) * U);
const dotGeo = new THREE.CircleGeometry(0.045, 24);
const unitGeo = new THREE.PlaneGeometry(1, 1);
const PILL_KEYS = ['badge', 'plan', 'tone'];
let glowTex, cards = [], nodes = [], panels = [], threads = [];
const badgeCache = new Map();
function badgeTex(text, color, outline) {
  const key = text + color + !!outline;
  if (!badgeCache.has(key)) { const b = drawBadge(text, color, outline); badgeCache.set(key, { t: tex(b.canvas), w: b.w * U, h: b.h * U }); }
  return badgeCache.get(key);
}

// scan pulse that rings the active card
const pulseMat = mat(null); pulseMat.opacity = 0;
const pulse = new THREE.Mesh(cardGeo, pulseMat); pulse.renderOrder = 19; scene.add(pulse);
const pulseSt = { s: 1, op: 0, card: null };

function buildCards() {
  glowTex = tex(drawGlow());
  pulseMat.map = glowTex; pulseMat.needsUpdate = true;
  POSTS.forEach((p, i) => {
    const baseTex = tex(drawCard(p));
    const m = mat(baseTex);
    const mesh = new THREE.Mesh(cardGeo, m);
    const glowMat = mat(glowTex); glowMat.opacity = 0;
    const glow = new THREE.Mesh(cardGeo, glowMat);
    mesh.add(glow);
    const pills = PILL_KEYS.map(() => {
      const pm = mat(null); const pmesh = new THREE.Mesh(unitGeo, pm);
      mesh.add(pmesh);
      return { mesh: pmesh, mat: pm, w: 0, h: 0 };
    });
    scene.add(mesh);
    const c = {
      i, p, mesh, mat: m, glow, glowMat, pills, home: null, baseTex, whoTex: null,
      st: { x: 0, y: 0, z: 0, s: 1, rz: 0, op: 0, amp: 1, glow: 0, badge: 0, plan: 0, tone: 0, ph: ((i * 0.6180339) % 1) * TAU },
    };
    // pills sit in a row above the post: match, then plan, then tone
    c.setPill = (k, text, color, outline) => {
      const b = badgeTex(text, color, outline), pill = pills[k];
      pill.mat.map = b.t; pill.mat.needsUpdate = true; pill.w = b.w; pill.h = b.h;
      let x = -CARD_W / 2;
      for (const pl of pills) {
        if (!pl.w) continue;
        pl.mesh.position.set(x + pl.w / 2, CARD_H / 2 + pl.h / 2 + 0.07, 0);
        x += pl.w + 0.06;
      }
    };
    c.clearPills = () => pills.forEach(pl => { pl.w = 0; });
    c.pillWorld = k => {
      const pos = pills[k].mesh.position;
      return { x: c.st.x + pos.x * c.st.s, y: c.st.y + pos.y * c.st.s };
    };
    c.setFront = on => {
      mesh.renderOrder = on ? 20 : 0; glow.renderOrder = on ? 21 : 0;
      pills.forEach(pl => { pl.mesh.renderOrder = on ? 22 : 0; });
    };
    // swap the anonymous header for the person Needora found
    c.reveal = who => {
      if (!c.whoTex) c.whoTex = tex(drawCard(p, who));
      m.map = c.whoTex; m.needsUpdate = true;
    };
    c.unreveal = () => { m.map = baseTex; m.needsUpdate = true; };
    cards.push(c);
  });
}

function layoutHomes() {
  computeGrid();
  // picks land in the middle rows, not at the edges
  const order = POSTS.map((_, i) => i);
  const mid = Math.floor(rows / 2) * cols, slots = [mid - cols + 1, mid + Math.floor(cols / 2), mid + cols - 2];
  PICKS.forEach((P, k) => {
    const s = Math.min(POSTS.length - 1, Math.max(0, slots[k]));
    const from = order.indexOf(P.idx);
    [order[from], order[s]] = [order[s], order[from]];
  });
  order.forEach((ci, slot) => {
    const col = slot % cols, row = Math.floor(slot / cols);
    const inRow = row === rows - 1 ? POSTS.length - row * cols : cols; // centre a short last row
    cards[ci].home = {
      x: (col - (inRow - 1) / 2) * (CARD_W + GX),
      y: ((rows - 1) / 2 - row) * (CARD_H + GY),
      z: Math.sin(ci * 12.9898) * 0.35,
    };
  });
}

function makeLine(order) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  const lineMat = new THREE.LineBasicMaterial({ color: ACCENT, transparent: true, depthTest: false, opacity: 0 });
  const line = new THREE.Line(geo, lineMat); line.renderOrder = order; line.frustumCulled = false;
  scene.add(line);

}
function setLine(l, ax, ay, bx, by, p, op) {
  const a = l.line.geometry.attributes.position.array;
  a[0] = ax; a[1] = ay; a[2] = 0; a[3] = ax + (bx - ax) * p; a[4] = ay + (by - ay) * p; a[5] = 0;
  l.line.geometry.attributes.position.needsUpdate = true;
  l.lineMat.opacity = op;
}

// crawl link styled after the Needora mark: a line that ends in a dot
const dotMat = () => new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, depthTest: false, depthWrite: false, opacity: 0 });
function addNode(card, [x, y], profile) {
  const m = mat(tex(drawNode(...profile)));
  const mesh = new THREE.Mesh(nodeGeo, m); mesh.renderOrder = 21;
  const dot = new THREE.Mesh(dotGeo, dotMat()); dot.renderOrder = 16;
  scene.add(mesh, dot);
  const n = { card, mesh, mat: m, dot, ...makeLine(15), st: { x, y, z: 0, s: 0, op: 0, lp: 0, lop: 0, ph: Math.random() * TAU } };

  return n;
}

// a canvas-backed plane that follows its card's hover and redraws whenever st.p changes
function addPanel(card, w, h, m, draw, x, y) {
  const [c, g] = makeCanvas(w + m * 2, h + m * 2);
  const t = tex(c), pm = mat(t);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry((w + m * 2) * U, (h + m * 2) * U), pm);
  mesh.renderOrder = 20; scene.add(mesh);
  const pn = {
    card, mesh, mat: pm, tex: t, drawn: null, st: { x, y, z: 0, s: 1, op: 0, p: 0 },
    redraw() {
      g.setTransform(TS, 0, 0, TS, 0, 0); g.clearRect(0, 0, w + m * 2, h + m * 2); g.translate(m, m);

function clearExtras() {
  for (const n of nodes) {
    scene.remove(n.mesh, n.line, n.dot);
    n.mat.map.dispose(); n.mat.dispose(); n.line.geometry.dispose(); n.lineMat.dispose(); n.dot.material.dispose();
  }
  for (const pn of panels) { scene.remove(pn.mesh); pn.tex.dispose(); pn.mat.dispose(); pn.mesh.geometry.dispose(); }

/* ---------- render loop ---------- */
const cam = { x: 0, y: 0, z: 30 };
let view = { type: 'overview' };
let L = 0;
const bob = c => Math.sin(L + c.st.ph) * 0.11 * c.st.amp * HOVER;

function tick(now) {
  updateTweens(now);
  L = (now % PERIOD) / PERIOD * TAU;

  for (const c of cards) {
    const s = c.st, a = s.amp * HOVER;
    c.mesh.visible = s.op > 0.002;
    c.mesh.position.set(s.x, s.y + bob(c), s.z);
    c.mesh.rotation.set(Math.sin(L + s.ph + 1.3) * 0.05 * a, Math.cos(L + s.ph * 1.7) * 0.065 * a, s.rz + Math.sin(L + s.ph + 2.1) * 0.012 * a);
    c.mesh.scale.setScalar(s.s);
    c.mat.opacity = s.op;
    c.glowMat.opacity = s.glow * s.op;
    c.glow.visible = s.glow > 0.002;
    c.pills.forEach((pl, k) => {
      const v = s[PILL_KEYS[k]];
      pl.mesh.visible = v > 0.002 && pl.w > 0;
      pl.mesh.scale.set(pl.w * Math.max(v, 0.001), pl.h * Math.max(v, 0.001), 1);
      pl.mat.opacity = Math.min(1, v) * s.op;
    });
  }

  for (const n of nodes) {
    const s = n.st, cp = n.card.mesh.position;
    n.mesh.visible = s.s > 0.002 && s.op > 0.002;
    n.mesh.position.set(s.x, s.y + Math.sin(L + s.ph) * 0.05 * HOVER, s.z);
    n.mesh.scale.setScalar(Math.max(s.s, 0.001));
    n.mat.opacity = s.op;
    setLine(n, cp.x, cp.y, n.mesh.position.x, n.mesh.position.y, s.lp, s.lop);
    const a = n.line.geometry.attributes.position.array;
    n.dot.position.set(a[3], a[4], 0);
    n.dot.material.opacity = s.lop;
    n.dot.visible = s.lop > 0.01;
  }

  for (const pn of panels) {
    const s = pn.st;
    pn.mesh.visible = s.op > 0.002;
    pn.mesh.position.set(s.x, s.y + bob(pn.card), s.z);
    pn.mesh.scale.setScalar(Math.max(s.s, 0.001));
    pn.mat.opacity = s.op;

  }

  if (pulseSt.card) {
    pulse.position.copy(pulseSt.card.mesh.position);
    pulse.rotation.copy(pulseSt.card.mesh.rotation);
    pulse.scale.setScalar(pulseSt.card.st.s * pulseSt.s);
  }
  pulse.visible = pulseSt.op > 0.002;
  pulseMat.opacity = pulseSt.op;

  camera.position.set(cam.x, cam.y, cam.z);
  camera.lookAt(cam.x, cam.y, 0);
  renderer.render(scene, camera);

}

    <div>
      <div class="rr-eyebrow">${esc(pg.eyebrow)}</div>
      <h1>${esc(pg.h1)}</h1>
      <p class="sub">${esc(pg.sub)}</p>
      <div class="asked">${ph(photo, 28)}<span>You asked in r/${esc(post.sub)}, ${esc(post.time)} ago: <q>${esc(post.title)}</q></span></div>
    </div>
    <div class="offer">
      <span class="tag">YOUR OFFER</span>
      <div class="oc-top"><h3>${esc(plan.name)} plan</h3><span class="off">−${o.pct}%</span></div>
      <div class="price"><s>$${fmt(plan.price)}</s><b>$${fmt(offerPrice(P))}</b><span>per month</span></div>
      <div class="then">For your first ${o.months} months, then $${fmt(plan.price)}. Cancel anytime.</div>
      <div class="timer"><small>Price held for ${esc(heldFor)}.<br>Ends in</small>
        <div class="clock" data-clock><span><b>--</b><i>hrs</i></span><span><b>--</b><i>min</i></span><span><b>--</b><i>sec</i></span></div></div>
      <ul>${o.includes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <span class="rbtn p">Claim ${o.pct}% off</span>
    </div>
  </section>
  <section class="rr-sec">
    <h2>Your routine, ready to run</h2>
    <div class="prompt"><small>We wrote this from your post.</small><p>${esc(pg.routine)}</p></div>
    <div class="run">
      <div class="run-head"><i></i><b>${esc(run.title)}</b><em>Sample data</em><span>${rows.length} of ${fmt(run.total)} ${esc(run.unit)}</span></div>
      <div class="progress" style="--w:${Math.max(4, Math.min(100, rows.length / run.total * 100 * 8)).toFixed(1)}%"><i></i></div>
      <div class="table"><table>
        <thead><tr>${run.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r => `<tr>${r.map((v, k) => `<td>${k === run.pill ? `<span class="pill ${pillKind(v)}">${esc(v)}</span>` : esc(v)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
    </div>
  </section>
  <footer class="rr-foot"><span>Made for ${esc(P.person ? P.person.name : P.madeFor)} by ${esc(CLIENT.name)}. Nothing changes in your tools until you approve.</span><span class="found">Found with <img src="${PRESENTER.lockupBlack}" alt="${esc(PRESENTER.name)}"></span></footer>`;
}

// the 48-hour hold starts the first time a page opens and keeps ticking across tabs
function tickClock() {
  const el = pageEl.querySelector('[data-clock]');
  if (!el || !page.deadline) return;
  const left = Math.max(0, page.deadline - Date.now()) / 1000;
  const parts = [Math.floor(left / 3600), Math.floor(left / 60) % 60, Math.floor(left) % 60];
  el.querySelectorAll('b').forEach((b, k) => { b.textContent = String(parts[k]).padStart(2, '0'); });
}
setInterval(tickClock, 1000);

function renderPage(i) {
  const P = PICKS[i];
  page.i = i;
  pageEl.innerHTML = `<div class="rr">${pageHTML(P)}</div>`;
  pageEl.scrollTop = 0;
  const [host, ...rest] = P.link.slug.split('/');
  urlEl.innerHTML = `<b>${esc(host)}</b>/${esc(rest.join('/'))}`;
  if (!page.deadline) page.deadline = Date.now() + OFFER_HOURS * 3600e3;
  tickClock();
  tabsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === i)));
}
function revealPage(delay) {
  const el = pageEl.firstElementChild;
  setTimeout(() => el && el.classList.add('go'), delay);
}
function pageStatus(i) {
  const P = PICKS[i], plan = PLANS[P.plan.pick];
  status(`${P.name}'s page · ${plan.name} at $${fmt(offerPrice(P))}/month, ${P.offer.pct}% off for ${OFFER_HOURS} hours`);
}

// screen rect of the link preview inside a reply panel
function linkRect(i) {
  const pn = per[i] && per[i].reply, P = PICKS[i];
  if (!pn) return null;
  const cx = pn.mesh.position.x, top = (RH / 2 - P._linkTop) * U + pn.mesh.position.y;
  const half = (RW - 40) / 2 * U;
  const a = new THREE.Vector3(cx - half, top, 0).project(camera);
  const b = new THREE.Vector3(cx + half, top - 90 * U, 0).project(camera);
  const sx = v => (v.x + 1) / 2 * innerWidth, sy = v => (1 - v.y) / 2 * innerHeight;
  return { left: sx(a), top: sy(a), width: sx(b) - sx(a), height: sy(b) - sy(a) };
}
function flipFrom(r) {
  const f = browser.getBoundingClientRect();
  browser.style.transition = 'none';
  browser.style.transform = `translate(${r.left - f.left}px, ${r.top - f.top}px) scale(${r.width / f.width}, ${r.height / f.height})`;
  browser.style.opacity = '0.5';
}
async function openPage(i) {
  renderPage(i);
  page.open = true;
  browser.hidden = false; scrim.hidden = false;
  const r = linkRect(i);
  if (r && !reduced) flipFrom(r);
  scrim.style.opacity = '0';
  browser.offsetWidth; // commit the start frame
  browser.style.transition = 'transform .62s cubic-bezier(.2,.85,.25,1), opacity .25s ease';
  browser.style.transform = 'none'; browser.style.opacity = '1';
  scrim.style.opacity = '1';
  revealPage(reduced ? 0 : 330);
  pageStatus(i);
  await sleep(650);
}
async function closePage() {
  if (!page.open) return;
  page.open = false;
  const el = pageEl.firstElementChild; if (el) el.classList.remove('go');
  const r = linkRect(page.i), f = browser.getBoundingClientRect();
  browser.style.transition = 'transform .45s cubic-bezier(.5,0,.75,0), opacity .3s ease .15s';
  if (r && !reduced) browser.style.transform = `translate(${r.left - f.left}px, ${r.top - f.top}px) scale(${r.width / f.width}, ${r.height / f.height})`;
  browser.style.opacity = '0';
  scrim.style.opacity = '0';
  status(`3 replies ready, each linking to its own ${CLIENT.name} page`);
  setBusy(state.busy);
  await sleep(460);
  if (!page.open) { browser.hidden = true; scrim.hidden = true; }
}
function showPage(i) {
  if (i === page.i && page.open) return;
  renderPage(i);
  revealPage(20);
  pageStatus(i);
}
function hidePageNow() {
  page.open = false; page.deadline = 0;
  browser.hidden = true; scrim.hidden = true;
  browser.style.transition = 'none'; browser.style.transform = 'none';
}
$('close').addEventListener('click', closePage);
scrim.addEventListener('click', closePage);

/* ---------- steps ---------- */
async function step1(id) {
  setStep(1); setBusy(true); status(`Screening ${fmt(RUN.screened)} posts…`);
  let found = 0;
  const order = cards.map((_, i) => i).sort(() => Math.random() - 0.5);
  await Promise.all(order.map((i, k) => {
    const c = cards[i], s = c.st, h = c.home;
    Object.assign(s, {
      x: h.x * 1.6 + (Math.random() - 0.5) * 6, y: h.y - 16 - Math.random() * 6, z: -10,
      rz: (Math.random() - 0.5) * 1.4, s: 0.8, op: 0, amp: 1, glow: 0, badge: 0, plan: 0, tone: 0,
    });
    const d = 120 + k * 32;
    to(s, { op: 1 }, 380, E.outCubic, d);
    return to(s, { x: h.x, y: h.y, z: h.z, rz: 0, s: 1 }, 1000, E.outExpo, d)
      .then(() => { if (id === runId) status(`Screening ${fmt(RUN.screened)} posts… ${++found} matches`); });
  }));
  if (id !== runId) return;
  state.step = 1;
  status(`${RUN.matched} people describe a problem ${CLIENT.name} solves`);
  setBusy(false);
}

async function step2(id) {
  setStep(2); setBusy(true); status('Scoring fit, intent, ideal customer and reply welcome…');
  const pk = picks();
  const others = cards.filter(c => !pk.includes(c));

  // pull the picks toward the camera in a row (column when portrait), centred in the free area
  const D = cam.z, vf = VF(), aspect = (innerWidth - inset()) / innerHeight;
  const gap = 0.6, port = portrait();
  const rowW = port ? CARD_W : 3 * CARD_W + 2 * gap;
  const rowH = port ? 3 * CARD_H + 2 * (gap + 0.3) : CARD_H + 0.4;
  const z2 = Math.max(-2, Math.min(D - 4, D - Math.max(rowW / (2 * 0.8 * vf * aspect), rowH / (2 * 0.68 * vf))));
  const cx = cam.x * z2 / D;

  others.forEach((c, k) => to(c.st, { op: 0.32, z: c.home.z - 1.5, s: 0.96 }, 650, E.outCubic, (k % 10) * 12));
  await sleep(160); if (id !== runId) return;
  pk.forEach((c, k) => {
    const P = PICKS[k], post = POSTS[P.idx];
    c.setFront(true);
    c.setPill(0, `${Math.round(post.score * 100)} match · ${P.need}`, ACCENT);
    const off = k - 1;
    const x = cx + (port ? 0 : off * (CARD_W + gap));
    const y = port ? -off * (CARD_H + gap + 0.3) : -0.1;
    const d = k * 110;
    to(c.st, { x, y, z: z2, rz: 0, s: 1, amp: 0.45 }, 850, E.softBack, d);
    to(c.st, { glow: 1 }, 420, E.outCubic, d + 380);
    to(c.st, { badge: 1 }, 480, E.outBack, d + 480);
  });
  await sleep(1150); if (id !== runId) return;
  state.step = 2;
  status('Top 3 where a reply is welcome: fit 3–4 of 4, intent 2–3 of 4');
  setBusy(false);
}

// Step 3: quick profile crawl per person, which reveals who they are and feeds the plan estimate
async function step3(id) {
  setStep(3); setBusy(true); status('Linking profiles…');
  const pk = picks();
  cards.filter(c => !pk.includes(c)).forEach(c => to(c.st, { op: 0.1, z: c.home.z - 6 }, 700, E.outCubic));
  pk.forEach((c, k) => {
    const [x, y] = colPos(k);
    c.setPill(0, `${Math.round(POSTS[PICKS[k].idx].score * 100)} match`, ACCENT);
    to(c.st, { x, y: y + Y_CARD, z: 0, s: 1, amp: 0.25, glow: 0.45 }, 750, E.inOutCubic, k * 50);
  });
  view = { type: 'columns' };
  await to(cam, viewFrame(view), 750, E.inOutCubic);
  if (id !== runId) return;

  const planned = [];
  for (let i = 0; i < PICKS.length; i++) {
    const P = PICKS[i], card = pk[i], [cx, cy] = colPos(i);
    per[i] = {};
    status(P.profiles.length ? `r/${POSTS[P.idx].sub} author · finding their other profiles…` : `r/${POSTS[P.idx].sub} author · anonymous, estimating from the post…`);
    pulseSt.card = card; pulseSt.s = 1; pulseSt.op = 0.8;
    to(pulseSt, { s: 1.15, op: 0 }, 420, E.outCubic);

    const ns = P.profiles.map((prof, j) => {
      const n = addNode(card, [cx + (j % 2 ? NODE_X : -NODE_X), cy + NODE_Y[j >> 1]], prof);
      const d = j * 65;
      to(n.st, { lp: 1, lop: 0.85 }, 140, E.outCubic, d);
      to(n.st, { s: NODE_S }, 260, E.outBack, d + 70);
      to(n.st, { op: 1 }, 140, E.outCubic, d + 70);
      return n;
    });
    await sleep(ns.length ? 5 * 65 + 70 + 300 : 250); if (id !== runId) return;

    // collapse the found profiles into a strip of icons under the post, and put a face to fictional posts
    if (P.person) card.reveal(P.person);
    const strip = addPanel(card, CW, 30, 0, g => drawStrip(g, P), cx, cy + STRIP_Y);
    strip.mesh.renderOrder = 22; per[i].strip = strip;
    ns.forEach((n, j) => to(n.st, {
      x: cx - CARD_W / 2 + (11 + j * 27) * U, y: cy + STRIP_Y, s: 0.1, op: 0, lop: 0,
    }, 300, E.inOutCubic, j * 20));
    to(strip.st, { op: 1 }, 220, E.outCubic, 200);
    status(P.person ? `Found ${P.person.name}, ${P.person.role} · estimating plan…` : `${P.name} · estimating plan…`);
    await sleep(260); if (id !== runId) return;

    const plan = addPanel(card, PW, PH, PM, (g, p) => drawPlan(g, P, p), cx, cy + PANEL_Y);
    per[i].plan = plan; plan.st.s = 0.92;
    to(plan.st, { s: 1, op: 1 }, 280, E.outCubic);
    planned.push(to(plan.st, { p: 1 }, 950, E.outCubic, 120));
    await sleep(200); if (id !== runId) return;
  }
  await Promise.all(planned); if (id !== runId) return;
  state.step = 3;
  status(`Likely plans: ${PICKS.map(P => PLANS[P.plan.pick].name).join(' · ')}`);
  setBusy(false);
}

// fold a panel into a pill above the post
function foldIntoPill(card, pn, k, text, color, delay, outline) {
  card.setPill(k, text, color, outline);
  const tgt = card.pillWorld(k);
  to(pn.st, { x: tgt.x, y: tgt.y, s: 0.12, op: 0 }, 360, E.inOutCubic, delay);
  card.st[PILL_KEYS[k]] = 0;
  to(card.st, { [PILL_KEYS[k]]: 1 }, 420, E.outBack, delay + 220);
}

async function step4(id) {
  setStep(4); setBusy(true); status('Reading each thread and its subreddit…');
  const pk = picks(), done = [];
  PICKS.forEach((P, i) => {
    const card = pk[i], [cx, cy] = colPos(i), d = i * 220;
    foldIntoPill(card, per[i].plan, 1, `${PLANS[P.plan.pick].name} · $${PLANS[P.plan.pick].price}/mo`, BLACK, d);
    const tone = addPanel(card, PW, PH, PM, (g, p) => drawTone(g, P, p), cx, cy + PANEL_Y - 0.3);
    per[i].tone = tone; tone.st.s = 0.94;
    to(tone.st, { y: cy + PANEL_Y, s: 1, op: 1 }, 340, E.outCubic, d + 200);
    done.push(to(tone.st, { p: 1 }, 950, E.outCubic, d + 320));
  });
  await Promise.all(done); if (id !== runId) return;
  state.step = 4;
  status(`Answer as: ${PICKS.map(P => TONES[P.tone.pick]).join(' · ')}`);
  setBusy(false);
}

async function step5(id) {
  setStep(5); setBusy(true);
  const pk = picks(), done = [];
  for (let i = 0; i < PICKS.length; i++) {
    const P = PICKS[i], card = pk[i], [cx, cy] = colPos(i);
    const tone = TONES[P.tone.pick].toLowerCase();
    status(`Writing ${/^[aeiou]/.test(tone) ? 'an' : 'a'} ${tone} reply to ${P.name}…`);
    foldIntoPill(card, per[i].tone, 2, `Tone · ${TONES[P.tone.pick]}`, ACCENT, 0, true);
    to(per[i].strip.st, { op: 0 }, 220);

    const reply = addPanel(card, RW, RH, PM, (g, p) => drawReply(g, P, p), cx, cy + REPLY_Y - 0.5);
    per[i].reply = reply;
    to(reply.st, { y: cy + REPLY_Y, op: 1 }, 420, E.outCubic, 180);

    const th = {
      card, reply, ...makeLine(14), st: { lp: 0, op: 0.5 },
      ax: (42 - CW / 2) * U, ay: (CH / 2 - 42) * U, ry: (RH / 2 - 34) * U,
    };
    threads.push(th);
    to(th.st, { lp: 1 }, 300, E.outCubic, 300);

    const typing = (P.reply.length + P.link.slug.length) * 7;
    done.push(to(reply.st, { p: 1 }, typing, E.linear, 450).then(() => to(reply.st, { p: 1.25 }, 380, E.outCubic)));
    await sleep(650); if (id !== runId) return;
  }
  await Promise.all(done); if (id !== runId) return;
  state.step = 5;
  status(`3 replies drafted as ${CLIENT.name}, each with its own link`);
  setBusy(false);
}

// Step 6: "click" the link in the first reply and open its page
async function step6(id) {
  setStep(6); setBusy(true);
  const P = PICKS[0], reply = per[0].reply;
  status(`Opening the link in the reply to ${P.tab || P.name}…`);
  await to(reply.st, { s: 0.965 }, 120, E.outCubic); if (id !== runId) return;
  to(reply.st, { s: 1 }, 300, E.outBack);
  await openPage(0); if (id !== runId) return;
  state.step = 6;
  setBusy(false);
}

const STEPS = [null, null, step2, step3, step4, step5, step6];
async function next() {
  if (state.busy) return;
  if (state.step >= LAST) {
    if (!page.open) { setBusy(true); await openPage(page.i); setBusy(false); }
    return;
  }
  STEPS[state.step + 1](runId);
}

const intro = $('intro');
async function reset(first) {
  const id = ++runId;
  hidePageNow();
  tweens.forEach(t => t.res()); tweens = [];
  clearExtras();
  pulseSt.op = 0; pulseSt.card = null;
  cards.forEach(c => { c.setFront(false); c.clearPills(); c.unreveal(); c.st.op = 0; });
  state.step = 0;
  setBusy(true);
  // Needora curtain: drops in on reset, lifts as the posts fly in
  if (!first && !reduced) {
    intro.style.transition = 'transform .45s cubic-bezier(.7,0,.2,1)';
    intro.classList.remove('out');
    await sleep(700); if (id !== runId) return;
  }
  layoutHomes();
  view = { type: 'overview' };
  Object.assign(cam, viewFrame(view));
  setTimeout(() => { if (id === runId) { intro.style.transition = ''; intro.classList.add('out'); } }, first ? 1300 : 250);
  await sleep(first ? 1000 : 0); if (id !== runId) return;
  step1(id);
}

nextBtn.addEventListener('click', next);
$('reset').addEventListener('click', () => reset(false));
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
  if (e.key === 'Escape') { closePage(); return; }
  if (page.open) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'r' || e.key === 'R') reset(false);
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (state.step === 1 && !state.busy) {
    layoutHomes();
    cards.forEach(c => to(c.st, { x: c.home.x, y: c.home.y, z: c.home.z }, 500, E.outCubic));
  }
  if (!tweens.some(t => t.obj === cam)) Object.assign(cam, viewFrame(view));
});

/* ---------- boot ---------- */
(async () => {
  const problem = configError();
  if (problem) { status('Config: ' + problem); console.error('Mention Scout config:', problem); return; }
  try {
    await Promise.race([
      Promise.all(['400', '500', '600', '700'].map(w => document.fonts.load(`${w} 16px "${THEME.font}"`)).concat(loadImages())),
      sleep(3000),
    ]);
  } catch {}
  buildCards();
  requestAnimationFrame(tick);
  reset(true);
})();
</script>
